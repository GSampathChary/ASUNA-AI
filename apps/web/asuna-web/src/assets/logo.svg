<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldRedGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF1E42" />
    </linearGradient>
    <radialGradient id="redCoreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1E42" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0D0406" stop-opacity="0" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="256" cy="256" r="220" fill="url(#redCoreAura)" />

  <!-- Outer Orbital Imperial Gold Energy Ring -->
  <ellipse cx="256" cy="256" rx="210" ry="85" fill="none" stroke="#FFD700" stroke-width="4" stroke-dasharray="12 18" transform="rotate(-25 256 256)" opacity="0.9" />

  <!-- Outer Crimson Red Diamond Crystal Frame -->
  <polygon points="256,56 416,256 256,456 96,256" fill="none" stroke="#FF1E42" stroke-width="8" filter="url(#goldGlow)" />

  <!-- Inner Layered Crystal Facets -->
  <polygon points="256,56 256,456 416,256" fill="#FF1E42" fill-opacity="0.25" stroke="#FF1E42" stroke-width="3" />
  <polygon points="256,56 256,456 96,256" fill="#FFD700" fill-opacity="0.2" stroke="#FFD700" stroke-width="3" />

  <!-- Central Glowing Gold Core -->
  <polygon points="256,156 326,256 256,356 186,256" fill="url(#goldRedGlow)" filter="url(#goldGlow)" />
  <circle cx="256" cy="256" r="28" fill="#FFF5C0" />

  <!-- Gold Particles -->
  <circle cx="160" cy="180" r="6" fill="#FFD700" />
  <circle cx="360" cy="320" r="8" fill="#FFD700" />
  <circle cx="340" cy="150" r="5" fill="#FF1E42" />
  <circle cx="180" cy="350" r="7" fill="#FF1E42" />
</svg>
